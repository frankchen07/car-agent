advisor:
  name: "WRX Mechanic"
  slug: "wrx"
  domain: "Automotive — 2003 Subaru Impreza WRX"
  description: "Mechanic advisor for Frank's 2003 WRX. Knows the car's history, engine rebuild, and service records."

paths:
  sources: "sources"
  output: "output/wrx"
  prompts: "prompts"
  base_prompt: "prompts/context-compaction-prompt.md"
  advisor_addendum: "prompts/wrx-addendum.md"

# Filename-pattern-based auto-classification (fnmatch style)
# Order matters: first match wins
classification_rules:
  - pattern: "manuals/*"
    tier: primary
  - pattern: "receipts/*"
    tier: secondary
  - pattern: "ownership/*"
    tier: secondary
  - pattern: "placeholders/*"
    tier: secondary
  # Fallback: unrecognized → LLM classifies

# Files to skip entirely (structured data handled by seed_db.py)
exclude_patterns:
  - ".DS_Store"
  - "*/.DS_Store"

llm:
  sonnet_model: "claude-sonnet-4-6-20250514"
  haiku_model: "claude-haiku-4-5-20251001"
  openrouter_sonnet_model: "anthropic/claude-sonnet-4.6"
  openrouter_haiku_model: "anthropic/claude-haiku-4.5"
  openai_sonnet_model: "gpt-4o"
  openai_haiku_model: "gpt-4o-mini"
  max_tokens_extraction: 8000
  max_tokens_classify: 512
  max_tokens_summarize: 4000
  max_tokens_runtime_context: 4000

chunking:
  target_tokens: 500
  min_tokens: 150
  max_tokens: 650
  overlap_tokens: 0
  tokenizer: "cl100k_base"
  max_sample_chunks: 40

embeddings:
  model: "all-MiniLM-L6-v2"
  tiers_to_embed: ["primary", "secondary"]

project_upload:
  top_chunks_per_category: 10
  include_tiers: ["primary"]
  min_confidence: "high"
